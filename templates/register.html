{% extends "base.html" %}
{% block title %}Тіркелу — Оқытушылар рейтингі{% endblock %}

{% block content %}
<script>document.body.dataset.titleKey='title.register';</script>
<div class="login-container">
    <div class="login-box register-box">
        <div class="login-logo">
            <div class="logo-icon">P</div>
            <h1 data-i18n="register.title">Жаңа аккаунт жасау</h1>
            <p class="subtitle" data-i18n="register.subtitle">Оқытушы ретінде тіркеліңіз</p>
        </div>

        <form method="POST" action="{{ url_for('register_submit') }}" id="registerForm" autocomplete="off">
            <div class="form-group">
                <label for="full_name" data-i18n="register.fullName">Аты-жөні *</label>
                <input type="text" id="full_name" name="full_name" class="input-field"
                       placeholder="Мысалы: Айгүл Серікқызы" data-i18n-placeholder="register.namePlaceholder" required minlength="3" maxlength="150"
                       autocomplete="name">
            </div>

            <div class="form-group">
                <label for="email" data-i18n="register.email">Email *</label>
                <input type="email" id="email" name="email" class="input-field"
                       placeholder="example@college.kz" data-i18n-placeholder="register.emailPlaceholder" required maxlength="100"
                       autocomplete="email">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="department" data-i18n="register.department">Кафедра</label>
                    <input type="text" id="department" name="department" class="input-field"
                           placeholder="Информатика" data-i18n-placeholder="register.deptPlaceholder" maxlength="100">
                </div>
                <div class="form-group">
                    <label for="position" data-i18n="register.position">Қызметі</label>
                    <input type="text" id="position" name="position" class="input-field"
                           placeholder="Аға оқытушы" data-i18n-placeholder="register.posPlaceholder" maxlength="100">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="password" data-i18n="register.password">Құпия сөз *</label>
                    <input type="password" id="password" name="password" class="input-field"
                       placeholder="Кем дегенде 6 таңба" data-i18n-placeholder="register.pwdPlaceholder" required minlength="6" maxlength="100"
                       autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label for="password_confirm" data-i18n="register.passwordConfirm">Құпия сөзді қайталаңыз *</label>
                    <input type="password" id="password_confirm" name="password_confirm" class="input-field"
                           placeholder="••••••••" data-i18n-placeholder="login.passwordPlaceholder" required minlength="6" maxlength="100"
                           autocomplete="new-password">
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-block btn-lg">
                <i class="fa-solid fa-user-plus"></i>
                <span data-i18n="register.submit">Тіркелу</span>
            </button>

            <div class="login-footer">
                <span data-i18n="register.haveAccount">Аккаунтыңыз бар ма?</span>
                <a href="{{ url_for('login_page') }}" class="register-link">
                    <i class="fa-solid fa-right-to-bracket"></i>
                    <span data-i18n="register.loginLink">Кіру</span>
                </a>
            </div>
        </form>
    </div>
</div>

<script>
(function () {
    const form = document.getElementById('registerForm');
    const pwd = document.getElementById('password');
    const pwd2 = document.getElementById('password_confirm');
    form.addEventListener('submit', function (e) {
        if (pwd.value !== pwd2.value) {
            e.preventDefault();
            const msg = (window._t && _t('flash.passwordMismatch')) || 'Құпия сөздер сәйкес келмейді';
            pwd2.setCustomValidity(msg);
            pwd2.reportValidity();
        } else {
            pwd2.setCustomValidity('');
        }
    });
    pwd2.addEventListener('input', () => pwd2.setCustomValidity(''));
})();
</script>
{% endblock %}
